<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b0a24 0%, #06020c 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      touch-action: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* UI 悬浮层 */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 20px) + 20px) 15px calc(env(safe-area-inset-bottom, 20px) + 20px);
    }

    .header {
      text-align: center;
      width: 100%;
      padding: 0 10px;
    }

    /* 纯粹柔和淡粉光，无白色发光层 */
    .header h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ff85ad;
      text-shadow: 
        0 0 10px rgba(255, 133, 173, 0.45),
        0 0 20px rgba(255, 106, 176, 0.25);
      margin-bottom: 8px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .header p {
      font-size: 0.95rem;
      color: #fce7f3;
      opacity: 0.88;
      letter-spacing: 0.3px;
      font-weight: 400;
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
      line-height: 1.35;
    }

    /* 左下角音乐按钮 */
    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      pointer-events: none;
    }

    .music-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      opacity: 0.7;
    }

    .music-btn.active {
      opacity: 1;
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .music-btn:active {
      transform: scale(0.95);
    }

    /* 居中交互容器 */
    .center-action {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: opacity 0.24s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
      width: max-content;
    }

    .btn-ready {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 34px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.18);
      transition: all 0.25s ease;
      touch-action: manipulation;
      white-space: nowrap !important;
      width: max-content;
      min-width: 170px;
    }

    .btn-ready:active {
      transform: scale(0.96);
    }

    .btn-blow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 36px;
      border-radius: 40px;
      border: none;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff7eaf 0%, #ff699a 100%);
      box-shadow: 0 8px 25px rgba(255, 105, 154, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: all 0.25s ease;
      touch-action: manipulation;
      letter-spacing: 0.5px;
      white-space: nowrap !important;
      width: max-content;
      animation: pulse 1.6s infinite ease-in-out;
    }

    .btn-blow:active {
      transform: scale(0.96);
    }

    .btn-relight {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 34px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.15);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.18);
      transition: all 0.2s ease;
      touch-action: manipulation;
      white-space: nowrap !important;
      width: max-content;
      min-width: 170px;
    }

    .btn-relight:active {
      transform: scale(0.96);
    }

    .sub-tip {
      font-size: 0.8rem;
      color: #fbcfe8;
      opacity: 0.85;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }

    .hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translate(-50%, -48%) scale(0.94) !important;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>

  <canvas id="stage"></canvas>

  <div class="ui-layer">
    <div class="header">
      <h1 id="mainTitle">Happy Birthday!</h1>
      <p id="subTitle">Make a wish and blow into the mic!</p>
    </div>

    <div class="center-action" id="actionContainer">
      <button class="btn-ready" id="mainBtn">Ready to Blow</button>
      <span class="sub-tip" id="statusHint">Tap to enable mic for blowing</span>
    </div>

    <div class="bottom-bar">
      <button class="music-btn" id="musicToggle">Music: OFF</button>
    </div>
  </div>

  <script>
    // --- 1. 画布与视口适配 ---
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // --- 2. 状态机管理 ---
    let appState = 'READY'; // READY -> BLOWING -> EXTINGUISHED
    let isLit = true;
    let micStarted = false;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let blowFrames = 0;
    let canBlow = false;

    // 音乐状态
    let isMusicOn = false;
    let isMusicPlaying = false;
    let songTimer = null;
    let musicGainNode = null; // 全局音乐增益，方便统一控制音量

    const mainTitle = document.getElementById('mainTitle');
    const subTitle = document.getElementById('subTitle');
    const actionContainer = document.getElementById('actionContainer');
    const mainBtn = document.getElementById('mainBtn');
    const statusHint = document.getElementById('statusHint');
    const musicToggle = document.getElementById('musicToggle');

    // --- 3. 音频上下文与音乐合成 ---
    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtxClass();
        // 创建全局音乐增益节点（不影响麦克风分析）
        musicGainNode = audioCtx.createGain();
        musicGainNode.gain.value = 0.6; // 适中音量
        musicGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 播放八音盒音符（直接连接到 musicGainNode，不经过分析器）
    function playMusicBoxBell(freq, time, duration, isLow = false) {
      if (!audioCtx || !isMusicOn || !musicGainNode) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = isLow ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, time);

        const vol = isLow ? 0.10 : 0.18;
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(vol, time + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

        osc.connect(gain);
        gain.connect(musicGainNode);

        osc.start(time);
        osc.stop(time + duration);
      } catch (e) {
        console.warn(e);
      }
    }

    // 《生日快乐》旋律（C大调，标准版）
    // 音符频率对照：C4=261.63, D4=293.66, E4=329.63, F4=349.23, G4=392.00, A4=440.00, B4=493.88, C5=523.25
    const birthdayMelody = [
      // Happy birthday to you
      { m: 392.00, b: 196.00, d: 0.5 }, // G
      { m: 392.00, b: 196.00, d: 0.25 }, // G
      { m: 440.00, b: 220.00, d: 0.75 }, // A
      { m: 392.00, b: 196.00, d: 0.75 }, // G
      { m: 523.25, b: 261.63, d: 0.75 }, // C5
      { m: 493.88, b: 246.94, d: 1.2 }, // B4

      // Happy birthday to you
      { m: 392.00, b: 196.00, d: 0.5 },
      { m: 392.00, b: 196.00, d: 0.25 },
      { m: 440.00, b: 220.00, d: 0.75 },
      { m: 392.00, b: 196.00, d: 0.75 },
      { m: 587.33, b: 293.66, d: 0.75 }, // D5
      { m: 523.25, b: 261.63, d: 1.2 },  // C5

      // Happy birthday dear [name]
      { m: 392.00, b: 196.00, d: 0.5 },
      { m: 392.00, b: 196.00, d: 0.25 },
      { m: 783.99, b: 392.00, d: 0.75 }, // G5
      { m: 659.25, b: 329.63, d: 0.75 }, // E5
      { m: 523.25, b: 261.63, d: 0.75 }, // C5
      { m: 493.88, b: 246.94, d: 0.75 }, // B4
      { m: 440.00, b: 220.00, d: 1.2 },  // A4

      // Happy birthday to you
      { m: 698.46, b: 349.23, d: 0.5 },  // F5
      { m: 698.46, b: 349.23, d: 0.25 }, // F5
      { m: 659.25, b: 329.63, d: 0.75 }, // E5
      { m: 523.25, b: 261.63, d: 0.75 }, // C5
      { m: 587.33, b: 293.66, d: 0.75 }, // D5
      { m: 523.25, b: 261.63, d: 1.5 }   // C5
    ];

    function startMusicLoop() {
      if (!isMusicOn || !audioCtx) return;
      if (songTimer) clearTimeout(songTimer);

      let now = audioCtx.currentTime + 0.08;
      let totalTime = 0;

      birthdayMelody.forEach(note => {
        // 主旋律（稍响）
        playMusicBoxBell(note.m, now, note.d * 1.3, false);
        // 低音伴奏（轻柔）
        playMusicBoxBell(note.b, now, note.d * 1.5, true);
        const step = note.d * 0.95; // 轻微断奏感
        now += step;
        totalTime += step;
      });

      isMusicPlaying = true;

      // 循环：整曲结束后短暂停顿再重复
      songTimer = setTimeout(() => {
        if (isMusicOn) startMusicLoop();
      }, (totalTime + 0.6) * 1000);
    }

    function stopMusic() {
      if (songTimer) clearTimeout(songTimer);
      isMusicPlaying = false;
    }

    function updateMusicButtonUI() {
      if (isMusicOn) {
        musicToggle.innerText = "Music: ON";
        musicToggle.classList.add('active');
      } else {
        musicToggle.innerText = "Music: OFF";
        musicToggle.classList.remove('active');
      }
    }

    // 音乐开关点击：切换状态，开关音乐
    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      ensureAudioContext();
      isMusicOn = !isMusicOn;
      updateMusicButtonUI();
      if (isMusicOn) {
        startMusicLoop();
      } else {
        stopMusic();
        // 立即静音所有已排程的音符（通过断开增益或取消定时器）
        if (musicGainNode) {
          musicGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
          musicGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        }
        // 重新设置增益（下次启动时恢复）
        setTimeout(() => {
          if (musicGainNode) {
            musicGainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
          }
        }, 300);
      }
    });

    // --- 4. 麦克风吹气拾音逻辑（改进：避免启动时误触发）---
    async function requestAndStartMic() {
      try {
        ensureAudioContext();
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.35;

        const source = audioCtx.createMediaStreamSource(micStream);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 320;

        source.connect(filter);
        filter.connect(analyser);

        micStarted = true;
        canBlow = true;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        // 重置吹气帧计数
        blowFrames = 0;

        function detectBlow() {
          if (!isLit || !canBlow || appState !== 'BLOWING') {
            blowFrames = 0;
            requestAnimationFrame(detectBlow);
            return;
          }

          analyser.getByteFrequencyData(dataArray);

          let energySum = 0;
          const lowBins = 8;
          for (let i = 0; i < lowBins; i++) {
            energySum += dataArray[i];
          }
          const lowAverage = energySum / lowBins;

          // 提高阈值到 50，且需要连续 6 帧（约 0.1 秒）才触发，避免启动瞬间误判
          if (lowAverage > 50) {
            blowFrames++;
            if (blowFrames >= 6) {
              extinguish();
              blowFrames = 0;
            }
          } else {
            blowFrames = Math.max(0, blowFrames - 1);
          }

          requestAnimationFrame(detectBlow);
        }
        detectBlow();
        return true;
      } catch (err) {
        console.warn('Microphone error:', err);
        return false;
      }
    }

    // --- 5. 核心交互按钮事件 ---
    async function handleMainBtnClick(e) {
      e.stopPropagation();

      // 阶段 1：点击白色 Ready to Blow
      if (appState === 'READY') {
        // 如果音乐是关闭的，打开音乐；如果已经开启，保持播放不打断
        if (!isMusicOn) {
          isMusicOn = true;
          updateMusicButtonUI();
          startMusicLoop();
        }
        // 如果音乐已开，不做任何操作，继续播放

        mainBtn.innerText = "Connecting...";
        // 点击后立即进入 BLOWING 状态并设置 canBlow = false，等待麦克风就绪后再启用
        appState = 'BLOWING';
        mainBtn.className = "btn-blow";
        mainBtn.innerText = "Tap or Blow";
        statusHint.innerText = "Blow onto mic or tap directly to extinguish!";
        canBlow = false; // 先禁用，防止瞬间误触发

        const ok = await requestAndStartMic();

        // 麦克风就绪后，给予短暂延迟再启用吹气检测
        if (ok) {
          // 延迟 800ms 再允许吹气，避免启动噪音
          setTimeout(() => {
            if (appState === 'BLOWING' && isLit) {
              canBlow = true;
              blowFrames = 0;
            }
          }, 800);
        } else {
          // 没有麦克风权限，直接允许点击吹灭
          canBlow = true;
        }
        return;
      }

      // 阶段 2：粉色状态下，直接点击也可吹灭
      if (appState === 'BLOWING' && isLit) {
        extinguish();
        return;
      }

      // 阶段 3：吹灭后点击 Relight Again
      if (appState === 'EXTINGUISHED') {
        relight();
        return;
      }
    }

    mainBtn.addEventListener('click', handleMainBtnClick);

    // --- 6. 吹熄与重燃动效 ---
    function extinguish() {
      if (!isLit) return;
      isLit = false;
      canBlow = false;
      blowFrames = 0;
      appState = 'EXTINGUISHED';

      mainTitle.innerText = "Wish Granted!";
      subTitle.innerText = "May all your dreams sparkle into reality!";

      actionContainer.classList.add('hidden');
      createBurst();

      // 吹灭时若音乐关闭则自动打开（保持原有逻辑，也可以保留；但通常音乐已经开启）
      if (!isMusicOn) {
        isMusicOn = true;
        updateMusicButtonUI();
        startMusicLoop();
      }

      setTimeout(() => {
        if (!isLit) {
          mainBtn.className = "btn-relight";
          mainBtn.innerText = "Relight Again";
          statusHint.innerText = "Tap above to relight the candles";
          actionContainer.classList.remove('hidden');
        }
      }, 1700);
    }

    function relight() {
      isLit = true;
      canBlow = false;
      blowFrames = 0;
      burstParticles.length = 0;

      mainTitle.innerText = "Happy Birthday!";
      subTitle.innerText = "Make a wish and blow into the mic!";

      appState = 'BLOWING';
      mainBtn.className = "btn-blow";
      mainBtn.innerText = "Tap or Blow";
      statusHint.innerText = "Blow onto mic or tap directly to extinguish!";

      // 给予 2 秒安全冷却期，杜绝秒灭
      setTimeout(() => {
        if (isLit) {
          canBlow = true;
          blowFrames = 0;
        }
      }, 2000);
    }

    // --- 7. 手势 / 鼠标滑动 3D 旋转控制 ---
    let rotationY = 0;
    let rotationX = 0;
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let dragVelocityX = 0;
    let dragVelocityY = 0;

    function onPointerDown(e) {
      if (e.target.closest('#actionContainer') || e.target.closest('#musicToggle')) return;
      isDragging = true;
      lastPointerX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      lastPointerY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      dragVelocityX = 0;
      dragVelocityY = 0;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const currentY = e.clientY || (e.touches && e.touches[0].clientY) || 0;

      const deltaX = currentX - lastPointerX;
      const deltaY = currentY - lastPointerY;

      dragVelocityX = deltaX * 0.006;
      dragVelocityY = deltaY * 0.003;

      rotationY += dragVelocityX;
      rotationX += dragVelocityY;
      rotationX = Math.max(-0.25, Math.min(0.25, rotationX));

      lastPointerX = currentX;
      lastPointerY = currentY;
    }

    function onPointerUp() {
      isDragging = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    // --- 8. 3D 星尘粒子系统与火焰 ---
    const cakeParticles = [];
    const flameParticles = [];
    const burstParticles = [];

    const cakeColors = [
      'rgba(255, 255, 255, ',
      'rgba(255, 253, 245, ',
      'rgba(254, 243, 199, ',
      'rgba(253, 230, 138, ',
      'rgba(250, 245, 255, '
    ];

    function addTier(radius, yBase, h, count, isTopDense) {
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const isWall = Math.random() < 0.6;
        let r, y;

        if (isWall) {
          r = radius + (Math.random() - 0.5) * 8;
          y = yBase + Math.random() * h;
        } else {
          r = Math.sqrt(Math.random()) * radius;
          y = yBase + h + (Math.random() - 0.5) * 3;
        }

        const size = Math.random() * 0.45 + 0.4;
        const color = cakeColors[Math.floor(Math.random() * cakeColors.length)];
        const alpha = isTopDense ? (Math.random() * 0.35 + 0.65) : (Math.random() * 0.3 + 0.4);

        cakeParticles.push({
          x: Math.cos(theta) * r,
          y: y,
          z: Math.sin(theta) * r,
          color: color,
          size: size,
          alpha: alpha
        });
      }
    }

    addTier(165, -95, 68, 5500, false);
    addTier(118, -25, 62, 5800, false);
    addTier(72, 38, 52, 6000, true);

    const candleXs = [-26, 0, 26];
    candleXs.forEach(cx => {
      for (let i = 0; i < 400; i++) {
        const theta = Math.random() * Math.PI * 2;
        const r = Math.random() * 3.2 + 0.8;
        const y = 90 + Math.random() * 46;
        cakeParticles.push({
          x: cx + Math.cos(theta) * r,
          y: y,
          z: Math.sin(theta) * r,
          color: 'rgba(255, 255, 255, ',
          size: Math.random() * 0.4 + 0.45,
          alpha: 0.95
        });
      }
    });

    candleXs.forEach(cx => {
      for (let i = 0; i < 160; i++) {
        const u = Math.random();
        const theta = Math.random() * Math.PI * 2;
        const r = (1 - u) * 6.5 * Math.random();
        flameParticles.push({
          cx: cx,
          theta: theta,
          r: r,
          u: u,
          speed: Math.random() * 6 + 10,
          color: u > 0.65 ? 'rgba(255, 90, 30, ' : 'rgba(255, 218, 10, '
        });
      }
    });

    function createBurst() {
      burstParticles.length = 0;
      const burstColors = [
        'rgba(255, 255, 255, ',
        'rgba(255, 250, 235, ',
        'rgba(254, 240, 190, ',
        'rgba(253, 224, 71, ',
        'rgba(255, 133, 173, '
      ];

      for (let i = 0; i < 2600; i++) {
        const cx = candleXs[i % 3];
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const speed = Math.random() * 11.5 + 2.8;

        burstParticles.push({
          x: cx + (Math.random() - 0.5) * 8,
          y: 138 + (Math.random() - 0.5) * 8,
          z: (Math.random() - 0.5) * 8,
          vx: Math.sin(phi) * Math.cos(theta) * speed,
          vy: Math.cos(phi) * speed + 0.5,
          vz: Math.sin(phi) * Math.sin(theta) * speed * 1.3,
          size: Math.random() * 0.35 + 0.28,
          color: burstColors[Math.floor(Math.random() * burstColors.length)],
          alpha: 1.0,
          drag: 0.974,
          life: 0,
          maxLife: Math.random() * 220 + 150
        });
      }
    }

    // --- 9. 渲染主循环 ---
    const fov = 420;

    function render() {
      requestAnimationFrame(render);

      ctx.clearRect(0, 0, width, height);

      if (!isDragging) {
        rotationY += 0.0028 + dragVelocityX;
        dragVelocityX *= 0.94;
        dragVelocityY *= 0.94;
        rotationX += dragVelocityY;
        rotationX *= 0.98;
      }

      const floatY = Math.sin(Date.now() * 0.0012) * 6;

      const cosRY = Math.cos(rotationY);
      const sinRY = Math.sin(rotationY);
      const cosRX = Math.cos(rotationX);
      const sinRX = Math.sin(rotationX);

      const renderQueue = [];
      const centerX = width / 2;
      const centerY = height * 0.52;

      function project(x, y, z) {
        const x1 = x * cosRY - z * sinRY;
        const z1 = x * sinRY + z * cosRY;
        const y2 = y * cosRX - z1 * sinRX;
        const z2 = y * sinRX + z1 * cosRX + 420;

        const scale = fov / Math.max(30, z2);
        return {
          x2d: centerX + x1 * scale,
          y2d: centerY - (y2 + floatY) * scale,
          z: z2,
          scale: scale
        };
      }

      // 1. 蛋糕主体粒子
      for (let i = 0; i < cakeParticles.length; i++) {
        const p = cakeParticles[i];
        const proj = project(p.x, p.y, p.z);
        renderQueue.push({
          x: proj.x2d,
          y: proj.y2d,
          z: proj.z,
          size: p.size * proj.scale,
          color: p.color,
          alpha: p.alpha
        });
      }

      // 2. 蜡烛火焰粒子
      if (isLit) {
        const t = Date.now() * 0.0025;
        for (let i = 0; i < flameParticles.length; i++) {
          const f = flameParticles[i];
          const wave = Math.sin(t * f.speed + f.u * 8) * 2.2;
          const fx = f.cx + Math.cos(f.theta) * (f.r + wave);
          const fz = Math.sin(f.theta) * (f.r + wave);
          const fy = 132 + f.u * 26;

          const proj = project(fx, fy, fz);
          renderQueue.push({
            x: proj.x2d,
            y: proj.y2d,
            z: proj.z - 10,
            size: 1.5 * proj.scale,
            color: f.color,
            alpha: 0.95
          });
        }
      }

      // 3. 漫天三维星尘粒子
      for (let i = 0; i < burstParticles.length; i++) {
        const b = burstParticles[i];
        b.life++;
        
        b.vx *= b.drag;
        b.vy *= b.drag;
        b.vz *= b.drag;

        b.x += b.vx;
        b.y += b.vy;
        b.z += b.vz;

        b.y += Math.sin(Date.now() * 0.001 + i) * 0.03;
        b.x += Math.cos(Date.now() * 0.001 + i) * 0.03;

        b.alpha = Math.max(0, 1.0 - (b.life / b.maxLife));

        const proj = project(b.x, b.y, b.z);

        if (b.alpha > 0.005) {
          renderQueue.push({
            x: proj.x2d,
            y: proj.y2d,
            z: proj.z,
            size: b.size * proj.scale,
            color: b.color,
            alpha: b.alpha
          });
        }
      }

      renderQueue.sort((a, b) => b.z - a.z);

      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < renderQueue.length; i++) {
        const item = renderQueue[i];
        if (item.size <= 0) continue;
        ctx.fillStyle = item.color + item.alpha + ')';
        ctx.beginPath();
        ctx.arc(item.x, item.y, Math.max(0.35, item.size), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    render();
  </script>
</body>
