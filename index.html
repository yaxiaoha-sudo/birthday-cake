<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b0a24 0%, #06020c 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      touch-action: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* UI 悬浮层 */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 20px) + 16px) 15px calc(env(safe-area-inset-bottom, 20px) + 20px);
    }

    .header {
      text-align: center;
      width: 100%;
      padding: 0 10px;
    }

    /* 纯粹柔和淡粉光 */
    .header h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ff85ad;
      text-shadow: 
        0 0 10px rgba(255, 133, 173, 0.45),
        0 0 20px rgba(255, 106, 176, 0.25);
      margin-bottom: 6px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .header p {
      font-size: 0.92rem;
      color: #fce7f3;
      opacity: 0.88;
      letter-spacing: 0.3px;
      font-weight: 400;
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
      line-height: 1.35;
    }

    /* 左下角音乐按钮 */
    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      pointer-events: none;
    }

    .music-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      opacity: 0.7;
    }

    .music-btn.active {
      opacity: 1;
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .music-btn:active {
      transform: scale(0.95);
    }

    /* 居中交互容器 */
    .center-action {
      position: absolute;
      top: 56%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: opacity 0.24s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
      width: max-content;
    }

    .btn-ready {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 34px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.18);
      transition: all 0.25s ease;
      touch-action: manipulation;
      white-space: nowrap !important;
      width: max-content;
      min-width: 170px;
    }

    .btn-ready:active {
      transform: scale(0.96);
    }

    .btn-blow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 36px;
      border-radius: 40px;
      border: none;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff7eaf 0%, #ff699a 100%);
      box-shadow: 0 8px 25px rgba(255, 105, 154, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: all 0.25s ease;
      touch-action: manipulation;
      letter-spacing: 0.5px;
      white-space: nowrap !important;
      width: max-content;
      animation: pulse 1.6s infinite ease-in-out;
    }

    .btn-blow:active {
      transform: scale(0.96);
    }

    .btn-relight {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 34px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.15);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.18);
      transition: all 0.2s ease;
      touch-action: manipulation;
      white-space: nowrap !important;
      width: max-content;
      min-width: 170px;
    }

    .btn-relight:active {
      transform: scale(0.96);
    }

    .sub-tip {
      font-size: 0.8rem;
      color: #fbcfe8;
      opacity: 0.85;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }

    .hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translate(-50%, -48%) scale(0.94) !important;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>

  <canvas id="stage"></canvas>

  <div class="ui-layer">
    <div class="header">
      <h1 id="mainTitle">Happy Birthday!</h1>
      <p id="subTitle">Make a wish and blow into the mic!</p>
    </div>

    <!-- 居中交互按钮容器 -->
    <div class="center-action" id="actionContainer">
      <button class="btn-ready" id="mainBtn">Ready to Blow</button>
      <span class="sub-tip" id="statusHint">Tap to enable mic for blowing</span>
    </div>

    <!-- 左下角音乐按钮：初始 OFF -->
    <div class="bottom-bar">
      <button class="music-btn" id="musicToggle">Music: OFF</button>
    </div>
  </div>

  <script>
    // --- 1. 彻底解决国内与移动端网络限制的纯净高保真音乐系统 ---
    let audioCtx = null;
    let masterGain = null;
    let isMusicOn = false;
    let musicTimer = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.28, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 纯正清脆的水晶生日歌八音盒引擎（永不依赖外部 MP3，100% 秒开秒播）
    function playMelodyNote(freq, time, dur) {
      if (!audioCtx || !isMusicOn) return;
      try {
        const osc = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();

        // 正弦波 + 三角泛音模拟清澈水晶质感
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, time);

        noteGain.gain.setValueAtTime(0.0001, time);
        noteGain.gain.linearRampToValueAtTime(0.26, time + 0.02);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

        osc.connect(noteGain);
        noteGain.connect(masterGain);

        osc.start(time);
        osc.stop(time + dur);
      } catch (e) {
        console.warn(e);
      }
    }

    // 经典的欢快明亮《Happy Birthday to You》正宗曲谱
    const bdaySong = [
      { f: 261.63, d: 0.35 }, { f: 261.63, d: 0.35 }, { f: 293.66, d: 0.7 }, { f: 261.63, d: 0.7 }, { f: 349.23, d: 0.7 }, { f: 329.63, d: 1.2 },
      { f: 261.63, d: 0.35 }, { f: 261.63, d: 0.35 }, { f: 293.66, d: 0.7 }, { f: 261.63, d: 0.7 }, { f: 392.00, d: 0.7 }, { f: 349.23, d: 1.2 },
      { f: 261.63, d: 0.35 }, { f: 261.63, d: 0.35 }, { f: 523.25, d: 0.7 }, { f: 440.00, d: 0.7 }, { f: 349.23, d: 0.7 }, { f: 329.63, d: 0.7 }, { f: 293.66, d: 1.0 },
      { f: 466.16, d: 0.35 }, { f: 466.16, d: 0.35 }, { f: 440.00, d: 0.7 }, { f: 349.23, d: 0.7 }, { f: 392.00, d: 0.7 }, { f: 349.23, d: 1.5 }
    ];

    function startMusic() {
      if (!isMusicOn) return;
      initAudioContext();
      if (musicTimer) clearTimeout(musicTimer);

      masterGain.gain.setValueAtTime(0.28, audioCtx.currentTime);

      let cur = audioCtx.currentTime + 0.05;
      let total = 0;
      bdaySong.forEach(n => {
        playMelodyNote(n.f, cur, n.d * 1.15);
        const step = n.d * 0.94;
        cur += step;
        total += step;
      });

      musicTimer = setTimeout(() => {
        if (isMusicOn) startMusic();
      }, (total + 0.3) * 1000);
    }

    function stopMusic() {
      if (musicTimer) clearTimeout(musicTimer);
      if (masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
      }
    }

    function updateMusicButtonUI() {
      if (isMusicOn) {
        musicToggle.innerText = "Music: ON";
        musicToggle.classList.add('active');
      } else {
        musicToggle.innerText = "Music: OFF";
        musicToggle.classList.remove('active');
      }
    }

    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudioContext();
      isMusicOn = !isMusicOn;
      updateMusicButtonUI();
      if (isMusicOn) {
        startMusic();
      } else {
        stopMusic();
      }
    });

    // --- 2. 画布与视口适配 ---
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateTextCoordinates(); // 屏幕旋转或尺寸变化时重新计算文字粒子
    }
    resize();
    window.addEventListener('resize', resize);

    // --- 3. 状态机管理与防秒灭安全保护 ---
    let appState = 'READY'; // READY -> BLOWING -> EXTINGUISHED
    let isLit = true;
    let micStarted = false;
    let analyser = null;
    let micStream = null;
    let blowFrames = 0;
    let canBlow = false; // 吹气安全锁

    const mainTitle = document.getElementById('mainTitle');
    const subTitle = document.getElementById('subTitle');
    const actionContainer = document.getElementById('actionContainer');
    const mainBtn = document.getElementById('mainBtn');
    const statusHint = document.getElementById('statusHint');

    // --- 4. 蜡烛与标题之间清晰可见的文字星尘聚合系统 ---
    const textParticles = [];
    let showTextParticles = false;
    let textMorphProgress = 0;

    function generateTextCoordinates() {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = 700;
      offCanvas.height = 240;
      const offCtx = offCanvas.getContext('2d');

      offCtx.fillStyle = '#ffffff';
      // 高清晰粗体英文
      offCtx.font = 'bold 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';

      // 两行居中文字
      offCtx.fillText('Stay Happy Stay bright', 350, 80);
      offCtx.fillText('Stay you My girl', 350, 140);

      const imgData = offCtx.getImageData(0, 0, 700, 240).data;
      const targets = [];

      const step = 3; // 高密度采样
      for (let y = 0; y < 240; y += step) {
        for (let x = 0; x < 700; x += step) {
          const alpha = imgData[(y * 700 + x) * 4 + 3];
          if (alpha > 120) {
            targets.push({
              tx: (x - 350) * 0.46,
              ty: (120 - y) * 0.46 + 88, // 恰好落在蜡烛火苗与标题之间的空位
              tz: (Math.random() - 0.5) * 6
            });
          }
        }
      }

      textParticles.length = 0;
      targets.forEach(coord => {
        textParticles.push({
          x: (Math.random() - 0.5) * 120,
          y: 120 + (Math.random() - 0.5) * 80,
          z: (Math.random() - 0.5) * 100,
          tx: coord.tx,
          ty: coord.ty,
          tz: coord.tz,
          size: Math.random() * 0.4 + 0.48, // 适度调大，保证清晰醒目
          color: Math.random() < 0.7 ? 'rgba(255, 255, 255, ' : 'rgba(255, 235, 175, '
        });
      });
    }

    // --- 5. 麦克风拾音算法（带 1.8 秒防瞬间电流爆破误触锁）---
    async function requestAndStartMic() {
      try {
        initAudioContext();
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.35;

        const source = audioCtx.createMediaStreamSource(micStream);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 320;

        source.connect(filter);
        filter.connect(analyser);

        micStarted = true;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        // 核心修复：开启麦克风的前 1.8 秒内强制关闭检测，吸收声卡开启脉冲！
        canBlow = false;
        blowFrames = 0;
        setTimeout(() => {
          if (isLit && appState === 'BLOWING') {
            canBlow = true;
            statusHint.innerText = "Listening: Blow steadily onto the mic!";
          }
        }, 1800);

        function detectBlow() {
          if (!isLit || !canBlow || appState !== 'BLOWING') {
            blowFrames = 0;
            requestAnimationFrame(detectBlow);
            return;
          }

          analyser.getByteFrequencyData(dataArray);

          let energySum = 0;
          const lowBins = 8;
          for (let i = 0; i < lowBins; i++) {
            energySum += dataArray[i];
          }
          const lowAverage = energySum / lowBins;

          // 必须检测到持续 5 帧以上真气流才熄灭
          if (lowAverage > 36) {
            blowFrames++;
            if (blowFrames >= 5) {
              extinguish();
              blowFrames = 0;
            }
          } else {
            blowFrames = Math.max(0, blowFrames - 1);
          }

          requestAnimationFrame(detectBlow);
        }
        detectBlow();
        return true;
      } catch (err) {
        console.warn('Microphone error:', err);
        return false;
      }
    }

    // --- 6. 核心交互按钮事件 ---
    async function handleMainBtnClick(e) {
      e.stopPropagation();

      // 点击开始吹蜡烛：音乐关着则开启，开着则平稳继续，绝不打断
      if (!isMusicOn) {
        isMusicOn = true;
        updateMusicButtonUI();
        startMusic();
      }

      // 阶段 1：点击 Ready to Blow -> 启动吹气模式
      if (appState === 'READY') {
        mainBtn.innerText = "Connecting...";
        const ok = await requestAndStartMic();

        appState = 'BLOWING';
        mainBtn.className = "btn-blow";
        mainBtn.innerText = "Tap or Blow";
        statusHint.innerText = ok ? "Preparing... (ready in a second)" : "Tap the button to extinguish!";
        return;
      }

      // 阶段 2：粉色状态下，直接点击也可吹灭
      if (appState === 'BLOWING' && isLit) {
        extinguish();
        return;
      }

      // 阶段 3：吹灭后点击 Relight Again
      if (appState === 'EXTINGUISHED') {
        relight();
        return;
      }
    }

    mainBtn.addEventListener('click', handleMainBtnClick);

    // --- 7. 吹灭动效与星尘文字聚合激活 ---
    function extinguish() {
      if (!isLit) return;
      isLit = false;
      canBlow = false;
      blowFrames = 0;
      appState = 'EXTINGUISHED';

      mainTitle.innerText = "Wish Granted!";
      subTitle.innerText = "May all your dreams sparkle into reality!";

      actionContainer.classList.add('hidden');
      createBurst();

      // 立即触发文字聚合粒子！
      showTextParticles = true;
      textMorphProgress = 0;

      // 如果音乐关着，此时也同步开启生日音乐
      if (!isMusicOn) {
        isMusicOn = true;
        updateMusicButtonUI();
        startMusic();
      }

      setTimeout(() => {
        if (!isLit) {
          mainBtn.className = "btn-relight";
          mainBtn.innerText = "Relight Again";
          statusHint.innerText = "Tap above to relight the candles";
          actionContainer.classList.remove('hidden');
        }
      }, 1800);
    }

    function relight() {
      isLit = true;
      canBlow = false;
      blowFrames = 0;
      burstParticles.length = 0;
      showTextParticles = false;

      mainTitle.innerText = "Happy Birthday!";
      subTitle.innerText = "Make a wish and blow into the mic!";

      appState = 'BLOWING';
      mainBtn.className = "btn-blow";
      mainBtn.innerText = "Tap or Blow";
      statusHint.innerText = "Blow onto mic or tap directly to extinguish!";

      // 点燃后给予 2 秒安全冷却，杜绝误触秒灭
      setTimeout(() => {
        if (isLit) {
          canBlow = true;
          blowFrames = 0;
        }
      }, 2000);
    }

    // --- 8. 手势 / 鼠标滑动 3D 旋转控制 ---
    let rotationY = 0;
    let rotationX = 0;
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let dragVelocityX = 0;
    let dragVelocityY = 0;

    function onPointerDown(e) {
      if (e.target.closest('#actionContainer') || e.target.closest('#musicToggle')) return;
      isDragging = true;
      lastPointerX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      lastPointerY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      dragVelocityX = 0;
      dragVelocityY = 0;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const currentY = e.clientY || (e.touches && e.touches[0].clientY) || 0;

      const deltaX = currentX - lastPointerX;
      const deltaY = currentY - lastPointerY;

      dragVelocityX = deltaX * 0.006;
      dragVelocityY = deltaY * 0.003;

      rotationY += dragVelocityX;
      rotationX += dragVelocityY;
      rotationX = Math.max(-0.25, Math.min(0.25, rotationX));

      lastPointerX = currentX;
      lastPointerY = currentY;
    }

    function onPointerUp() {
      isDragging = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    // --- 9. 3D 星尘粒子系统与火焰 ---
    const cakeParticles = [];
    const flameParticles = [];
    const burstParticles = [];

    const cakeColors = [
      'rgba(255, 255, 255, ',
      'rgba(255, 253, 245, ',
      'rgba(254, 243, 199, ',
      'rgba(253, 230, 138, ',
      'rgba(250, 245, 255, '
    ];

    function addTier(radius, yBase, h, count, isTopDense) {
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const isWall = Math.random() < 0.6;
        let r, y;

        if (isWall) {
          r = radius + (Math.random() - 0.5) * 8;
          y = yBase + Math.random() * h;
        } else {
          r = Math.sqrt(Math.random()) * radius;
          y = yBase + h + (Math.random() - 0.5) * 3;
        }

        const size = Math.random() * 0.45 + 0.4;
        const color = cakeColors[Math.floor(Math.random() * cakeColors.length)];
        const alpha = isTopDense ? (Math.random() * 0.35 + 0.65) : (Math.random() * 0.3 + 0.4);

        cakeParticles.push({
          x: Math.cos(theta) * r,
          y: y,
          z: Math.sin(theta) * r,
          color: color,
          size: size,
          alpha: alpha
        });
      }
    }

    addTier(165, -95, 68, 5500, false);
    addTier(118, -25, 62, 5800, false);
    addTier(72, 38, 52, 6000, true);

    const candleXs = [-26, 0, 26];
    candleXs.forEach(cx => {
      for (let i = 0; i < 400; i++) {
        const theta = Math.random() * Math.PI * 2;
        const r = Math.random() * 3.2 + 0.8;
        const y = 90 + Math.random() * 46;
        cakeParticles.push({
          x: cx + Math.cos(theta) * r,
          y: y,
          z: Math.sin(theta) * r,
          color: 'rgba(255, 255, 255, ',
          size: Math.random() * 0.4 + 0.45,
          alpha: 0.95
        });
      }
    });

    candleXs.forEach(cx => {
      for (let i = 0; i < 160; i++) {
        const u = Math.random();
        const theta = Math.random() * Math.PI * 2;
        const r = (1 - u) * 6.5 * Math.random();
        flameParticles.push({
          cx: cx,
          theta: theta,
          r: r,
          u: u,
          speed: Math.random() * 6 + 10,
          color: u > 0.65 ? 'rgba(255, 90, 30, ' : 'rgba(255, 218, 10, '
        });
      }
    });

    function createBurst() {
      burstParticles.length = 0;
      const burstColors = [
        'rgba(255, 255, 255, ',
        'rgba(255, 250, 235, ',
        'rgba(254, 240, 190, ',
        'rgba(253, 224, 71, ',
        'rgba(255, 133, 173, '
      ];

      for (let i = 0; i < 2600; i++) {
        const cx = candleXs[i % 3];
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const speed = Math.random() * 11.5 + 2.8;

        burstParticles.push({
          x: cx + (Math.random() - 0.5) * 8,
          y: 138 + (Math.random() - 0.5) * 8,
          z: (Math.random() - 0.5) * 8,
          vx: Math.sin(phi) * Math.cos(theta) * speed,
          vy: Math.cos(phi) * speed + 0.5,
          vz: Math.sin(phi) * Math.sin(theta) * speed * 1.3,
          size: Math.random() * 0.35 + 0.28,
          color: burstColors[Math.floor(Math.random() * burstColors.length)],
          alpha: 1.0,
          drag: 0.974,
          life: 0,
          maxLife: Math.random() * 220 + 150
        });
      }
    }

    // --- 10. 渲染主循环 ---
    const fov = 420;

    function render() {
      requestAnimationFrame(render);

      ctx.clearRect(0, 0, width, height);

      if (!isDragging) {
        rotationY += 0.0028 + dragVelocityX;
        dragVelocityX *= 0.94;
        dragVelocityY *= 0.94;
        rotationX += dragVelocityY;
        rotationX *= 0.98;
      }

      const floatY = Math.sin(Date.now() * 0.0012) * 6;

      const cosRY = Math.cos(rotationY);
      const sinRY = Math.sin(rotationY);
      const cosRX = Math.cos(rotationX);
      const sinRX = Math.sin(rotationX);

      const renderQueue = [];
      const centerX = width / 2;
      const centerY = height * 0.52;

      function project(x, y, z) {
        const x1 = x * cosRY - z * sinRY;
        const z1 = x * sinRY + z * cosRY;
        const y2 = y * cosRX - z1 * sinRX;
        const z2 = y * sinRX + z1 * cosRX + 420;

        const scale = fov / Math.max(30, z2);
        return {
          x2d: centerX + x1 * scale,
          y2d: centerY - (y2 + floatY) * scale,
          z: z2,
          scale: scale
        };
      }

      // 1. 蛋糕主体粒子
      for (let i = 0; i < cakeParticles.length; i++) {
        const p = cakeParticles[i];
        const proj = project(p.x, p.y, p.z);
        renderQueue.push({
          x: proj.x2d,
          y: proj.y2d,
          z: proj.z,
          size: p.size * proj.scale,
          color: p.color,
          alpha: p.alpha
        });
      }

      // 2. 蜡烛火焰粒子
      if (isLit) {
        const t = Date.now() * 0.0025;
        for (let i = 0; i < flameParticles.length; i++) {
          const f = flameParticles[i];
          const wave = Math.sin(t * f.speed + f.u * 8) * 2.2;
          const fx = f.cx + Math.cos(f.theta) * (f.r + wave);
          const fz = Math.sin(f.theta) * (f.r + wave);
          const fy = 132 + f.u * 26;

          const proj = project(fx, fy, fz);
          renderQueue.push({
            x: proj.x2d,
            y: proj.y2d,
            z: proj.z - 10,
            size: 1.5 * proj.scale,
            color: f.color,
            alpha: 0.95
          });
        }
      }

      // 3. 漫天三维星尘粒子
      for (let i = 0; i < burstParticles.length; i++) {
        const b = burstParticles[i];
        b.life++;
        
        b.vx *= b.drag;
        b.vy *= b.drag;
        b.vz *= b.drag;

        b.x += b.vx;
        b.y += b.vy;
        b.z += b.vz;

        b.y += Math.sin(Date.now() * 0.001 + i) * 0.03;
        b.x += Math.cos(Date.now() * 0.001 + i) * 0.03;

        b.alpha = Math.max(0, 1.0 - (b.life / b.maxLife));

        const proj = project(b.x, b.y, b.z);

        if (b.alpha > 0.005) {
          renderQueue.push({
            x: proj.x2d,
            y: proj.y2d,
            z: proj.z,
            size: b.size * proj.scale,
            color: b.color,
            alpha: b.alpha
          });
        }
      }

      // 4. 文字粒子聚合："Stay Happy Stay bright / Stay you My girl"
      if (showTextParticles) {
        textMorphProgress = Math.min(1.0, textMorphProgress + 0.024);
        const ease = 1 - Math.pow(1 - textMorphProgress, 3);

        for (let i = 0; i < textParticles.length; i++) {
          const tp = textParticles[i];
          const curX = tp.x + (tp.tx - tp.x) * ease;
          const curY = tp.y + (tp.ty - tp.y) * ease;
          const curZ = tp.z + (tp.tz - tp.z) * ease;

          const shimmer = Math.sin(Date.now() * 0.005 + i) * 0.12;
          const targetAlpha = Math.min(1.0, textMorphProgress * 1.3 + shimmer);

          const proj = project(curX, curY, curZ);
          renderQueue.push({
            x: proj.x2d,
            y: proj.y2d,
            z: proj.z - 8,
            size: (tp.size + shimmer * 0.15) * proj.scale,
            color: tp.color,
            alpha: targetAlpha
          });
        }
      }

      renderQueue.sort((a, b) => b.z - a.z);

      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < renderQueue.length; i++) {
        const item = renderQueue[i];
        if (item.size <= 0) continue;
        ctx.fillStyle = item.color + item.alpha + ')';
        ctx.beginPath();
        ctx.arc(item.x, item.y, Math.max(0.35, item.size), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    render();
  </script>
</body>
