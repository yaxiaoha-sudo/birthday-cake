<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b0a24 0%, #06020c 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      touch-action: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 20px) + 20px) 15px calc(env(safe-area-inset-bottom, 20px) + 20px);
    }

    .header {
      text-align: center;
      width: 100%;
      padding: 0 10px;
    }

    .header h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ff85ad;
      text-shadow: 
        0 0 10px rgba(255, 133, 173, 0.45),
        0 0 20px rgba(255, 106, 176, 0.25);
      margin-bottom: 8px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .header p {
      font-size: 0.95rem;
      color: #fce7f3;
      opacity: 0.88;
      letter-spacing: 0.3px;
      font-weight: 400;
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
      line-height: 1.35;
    }

    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      pointer-events: none;
    }

    .music-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      opacity: 0.7;
    }

    .music-btn.active {
      opacity: 1;
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .music-btn:active {
      transform: scale(0.95);
    }

    .center-action {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: opacity 0.24s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
      width: max-content;
    }

    .btn-ready {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 34px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.18);
      transition: all 0.25s ease;
      touch-action: manipulation;
      white-space: nowrap !important;
      width: max-content;
      min-width: 170px;
    }

    .btn-ready:active {
      transform: scale(0.96);
    }

    .btn-blow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 36px;
      border-radius: 40px;
      border: none;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff7eaf 0%, #ff699a 100%);
      box-shadow: 0 8px 25px rgba(255, 105, 154, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: all 0.25s ease;
      touch-action: manipulation;
      letter-spacing: 0.5px;
      white-space: nowrap !important;
      width: max-content;
      animation: pulse 1.6s infinite ease-in-out;
    }

    .btn-blow:active {
      transform: scale(0.96);
    }

    .btn-relight {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 34px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.15);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.18);
      transition: all 0.2s ease;
      touch-action: manipulation;
      white-space: nowrap !important;
      width: max-content;
      min-width: 170px;
    }

    .btn-relight:active {
      transform: scale(0.96);
    }

    .sub-tip {
      font-size: 0.8rem;
      color: #fbcfe8;
      opacity: 0.85;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }

    .hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translate(-50%, -48%) scale(0.94) !important;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>

  <canvas id="stage"></canvas>

  <div class="ui-layer">
    <div class="header">
      <h1 id="mainTitle">Happy Birthday!</h1>
      <p id="subTitle">Make a wish and blow into the mic!</p>
    </div>

    <div class="center-action" id="actionContainer">
      <button class="btn-ready" id="mainBtn">Ready to Blow</button>
      <span class="sub-tip" id="statusHint">Tap to enable mic for blowing</span>
    </div>

    <div class="bottom-bar">
      <button class="music-btn" id="musicToggle">Music: OFF</button>
    </div>
  </div>

  <script>
    // --- 1. 画布与视口适配 ---
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // --- 2. 状态机管理 ---
    let appState = 'READY';
    let isLit = true;
    let micStarted = false;
    let blowFrames = 0;
    let canBlow = false;

    // 默认进入页面时：音乐关闭
    let isMusicOn = false;
    let songTimer = null;

    // 关键优化：独立分立两个 AudioContext，麦克风硬件切换绝不干扰音乐
    let musicAudioCtx = null;
    let musicGainNode = null;
    let micAudioCtx = null;
    let analyser = null;
    let micStream = null;

    const mainTitle = document.getElementById('mainTitle');
    const subTitle = document.getElementById('subTitle');
    const actionContainer = document.getElementById('actionContainer');
    const mainBtn = document.getElementById('mainBtn');
    const statusHint = document.getElementById('statusHint');
    const musicToggle = document.getElementById('musicToggle');

    // --- 3. 音乐播放专有音频通道 ---
    function ensureMusicContext() {
      if (!musicAudioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        musicAudioCtx = new AudioCtxClass();
        musicGainNode = musicAudioCtx.createGain();
        musicGainNode.gain.value = 0.6;
        musicGainNode.connect(musicAudioCtx.destination);
      }
      if (musicAudioCtx.state === 'suspended') {
        musicAudioCtx.resume().catch(() => {});
      }
      return musicAudioCtx;
    }

    function playMusicBoxBell(freq, time, duration, isLow = false) {
      if (!musicAudioCtx || !isMusicOn || !musicGainNode) return;
      try {
        const osc = musicAudioCtx.createOscillator();
        const gain = musicAudioCtx.createGain();

        osc.type = isLow ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, time);

        const vol = isLow ? 0.10 : 0.18;
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(vol, time + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

        osc.connect(gain);
        gain.connect(musicGainNode);

        osc.start(time);
        osc.stop(time + duration);
      } catch (e) {
        console.warn(e);
      }
