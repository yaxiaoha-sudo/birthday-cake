<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b0a24 0%, #06020c 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      touch-action: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 20px) + 20px) 15px calc(env(safe-area-inset-bottom, 20px) + 20px);
    }

    .header {
      text-align: center;
      width: 100%;
      padding: 0 10px;
    }

    .header h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ff85ad;
      text-shadow: 
        0 0 10px rgba(255, 133, 173, 0.45),
        0 0 20px rgba(255, 106, 176, 0.25);
      margin-bottom: 8px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .header p {
      font-size: 0.95rem;
      color: #fce7f3;
      opacity: 0.88;
      letter-spacing: 0.3px;
      font-weight: 400;
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
      line-height: 1.35;
    }

    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      pointer-events: none;
    }

    .music-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      opacity: 0.7;
    }

    .music-btn.active {
      opacity: 1;
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
    }

    .music-btn:active {
      transform: scale(0.95);
    }

    .center-action {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: opacity 0.24s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
      width: max-content;
    }

    .btn-ready {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 34px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.88);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.18);
      transition: all 0.25s ease;
      touch-action: manipulation;
      white-space: nowrap !important;
      width: max-content;
      min-width: 170px;
    }

    .btn-ready:active {
      transform: scale(0.96);
    }

    .btn-blow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 36px;
      border-radius: 40px;
      border: none;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff7eaf 0%, #ff699a 100%);
      box-shadow: 0 8px 25px rgba(255, 105, 154, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: all 0.25s ease;
      touch-action: manipulation;
      letter-spacing: 0.5px;
      white-space: nowrap !important;
      width: max-content;
      animation: pulse 1.6s infinite ease-in-out;
    }

    .btn-blow:active {
      transform: scale(0.96);
    }

    .btn-relight {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 34px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.15);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.18);
      transition: all 0.2s ease;
      touch-action: manipulation;
      white-space: nowrap !important;
      width: max-content;
      min-width: 170px;
    }

    .btn-relight:active {
      transform: scale(0.96);
    }

    .sub-tip {
      font-size: 0.8rem;
      color: #fbcfe8;
      opacity: 0.85;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }

    .hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translate(-50%, -48%) scale(0.94) !important;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>

  <canvas id="stage"></canvas>

  <div class="ui-layer">
    <div class="header">
      <h1 id="mainTitle">Happy Birthday!</h1>
      <p id="subTitle">Make a wish and blow into the mic!</p>
    </div>

    <div class="center-action" id="actionContainer">
      <button class="btn-ready" id="mainBtn">Ready to Blow</button>
      <span class="sub-tip" id="statusHint">Tap to enable mic for blowing</span>
    </div>

    <div class="bottom-bar">
      <button class="music-btn" id="musicToggle">Music: OFF</button>
    </div>
  </div>

  <script>
    // --- 1. 画布与视口适配 ---
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // --- 2. 状态机管理 ---
    let appState = 'READY';
    let isLit = true;
    let micStarted = false;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let blowFrames = 0;
    let canBlow = false;

    let isMusicOn = false;
    let songTimer = null;
    let musicGainNode = null;

    const mainTitle = document.getElementById('mainTitle');
    const subTitle = document.getElementById('subTitle');
    const actionContainer = document.getElementById('actionContainer');
    const mainBtn = document.getElementById('mainBtn');
    const statusHint = document.getElementById('statusHint');
    const musicToggle = document.getElementById('musicToggle');

    // --- 3. 音频上下文与音乐合成 ---
    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtxClass();
        musicGainNode = audioCtx.createGain();
        musicGainNode.gain.value = 0.6;
        musicGainNode.connect(audioCtx.destination);
      }
      return audioCtx;
    }

    function resumeAudioContext() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(e => console.warn('resume failed', e));
      }
    }

    function playMusicBoxBell(freq, time, duration, isLow = false) {
      if (!audioCtx || !isMusicOn || !musicGainNode) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = isLow ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, time);

        const vol = isLow ? 0.10 : 0.18;
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(vol, time + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

        osc.connect(gain);
        gain.connect(musicGainNode);

        osc.start(time);
        osc.stop(time + duration);
      } catch (e) {
        console.warn(e);
      }
    }

    const birthdayMelody = [
      { m: 392.00, b: 196.00, d: 0.5 },
      { m: 392.00, b: 196.00, d: 0.25 },
      { m: 440.00, b: 220.00, d: 0.75 },
      { m: 392.00, b: 196.00, d: 0.75 },
      { m: 523.25, b: 261.63, d: 0.75 },
      { m: 493.88, b: 246.94, d: 1.2 },

      { m: 392.00, b: 196.00, d: 0.5 },
      { m: 392.00, b: 196.00, d: 0.25 },
      { m: 440.00, b: 220.00, d: 0.75 },
      { m: 392.00, b: 196.00, d: 0.75 },
      { m: 587.33, b: 293.66, d: 0.75 },
      { m: 523.25, b: 261.63, d: 1.2 },

      { m: 392.00, b: 196.00, d: 0.5 },
      { m: 392.00, b: 196.00, d: 0.25 },
      { m: 783.99, b: 392.00, d: 0.75 },
      { m: 659.25, b: 329.63, d: 0.75 },
      { m: 523.25, b: 261.63, d: 0.75 },
      { m: 493.88, b: 246.94, d: 0.75 },
      { m: 440.00, b: 220.00, d: 1.2 },

      { m: 698.46, b: 349.23, d: 0.5 },
      { m: 698.46, b: 349.23, d: 0.25 },
      { m: 659.25, b: 329.63, d: 0.75 },
      { m: 523.25, b: 261.63, d: 0.75 },
      { m: 587.33, b: 293.66, d: 0.75 },
      { m: 523.25, b: 261.63, d: 1.5 }
    ];

    function startMusicLoop() {
      if (!isMusicOn || !audioCtx) return;
      if (songTimer) clearTimeout(songTimer);

      resumeAudioContext();

      let now = audioCtx.currentTime + 0.08;
      let totalTime = 0;

      birthdayMelody.forEach(note => {
        playMusicBoxBell(note.m, now, note.d * 1.3, false);
        playMusicBoxBell(note.b, now, note.d * 1.5, true);
        const step = note.d * 0.95;
        now += step;
        totalTime += step;
      });

      songTimer = setTimeout(() => {
        if (isMusicOn) startMusicLoop();
      }, (totalTime + 0.6) * 1000);
    }

    function stopMusic() {
      if (songTimer) clearTimeout(songTimer);
      if (musicGainNode && audioCtx) {
        try {
          const now = audioCtx.currentTime;
          musicGainNode.gain.cancelScheduledValues(now);
          musicGainNode.gain.setValueAtTime(0, now);
        } catch (e) {}
      }
    }

    function resumeMusicGain() {
      if (musicGainNode && audioCtx) {
        try {
          const now = audioCtx.currentTime;
          musicGainNode.gain.cancelScheduledValues(now);
          musicGainNode.gain.setValueAtTime(0.6, now);
        } catch (e) {}
      }
    }

    function updateMusicButtonUI() {
      if (isMusicOn) {
        musicToggle.innerText = "Music: ON";
        musicToggle.classList.add('active');
      } else {
        musicToggle.innerText = "Music: OFF";
        musicToggle.classList.remove('active');
      }
    }

    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      ensureAudioContext();
      resumeAudioContext();

      isMusicOn = !isMusicOn;
      updateMusicButtonUI();

      if (isMusicOn) {
        resumeMusicGain();
        startMusicLoop();
      } else {
        stopMusic();
      }
    });

    // --- 4. 麦克风吹气拾音 ---
    async function requestAndStartMic() {
      try {
        ensureAudioContext();
        resumeAudioContext();

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        resumeAudioContext();

        if (isMusicOn) {
          setTimeout(() => {
            resumeAudioContext();
            resumeMusicGain();
            if (isMusicOn && !songTimer) {
              startMusicLoop();
            }
          }, 100);
        }

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.35;

        const source = audioCtx.createMediaStreamSource(micStream);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 320;

        source.connect(filter);
        filter.connect(analyser);

        micStarted = true;
        canBlow = true;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        blowFrames = 0;

        function detectBlow() {
          if (!isLit || !canBlow || appState !== 'BLOWING') {
            blowFrames = 0;
            requestAnimationFrame(detectBlow);
            return;
          }

          analyser.getByteFrequencyData(dataArray);

          let energySum = 0;
          const lowBins = 8;
          for (let i = 0; i < lowBins; i++) {
            energySum += dataArray[i];
          }
          const lowAverage = energySum / lowBins;

          if (lowAverage > 55) {
            blowFrames++;
            if (blowFrames >= 8) {
              extinguish();
              blowFrames = 0;
            }
          } else {
            blowFrames = Math.max(0, blowFrames - 1);
          }

          requestAnimationFrame(detectBlow);
        }
        detectBlow();
        return true;
      } catch (err) {
        console.warn('Microphone error:', err);
        return false;
      }
    }

    // --- 5. 核心交互按钮事件 ---
    async function handleMainBtnClick(e) {
      e.stopPropagation();

      if (appState === 'READY') {
        if (!isMusicOn) {
          isMusicOn = true;
          updateMusicButtonUI();
          ensureAudioContext();
          resumeAudioContext();
          resumeMusicGain();
          startMusicLoop();
        } else {
          resumeAudioContext();
          resumeMusicGain();
          if (!songTimer) startMusicLoop();
        }

        mainBtn.innerText = "Connecting...";
        appState = 'BLOWING';
        mainBtn.className = "btn-blow";
        mainBtn.innerText = "Tap or Blow";
        statusHint.innerText = "Blow onto mic or tap directly to extinguish!";
        canBlow = false;

        const ok = await requestAndStartMic();

        if (ok) {
          setTimeout(() => {
            if (appState === 'BLOWING' && isLit) {
              canBlow = true;
              blowFrames = 0;
            }
          }, 900);
        } else {
          canBlow = true;
        }
        return;
      }

      if (appState === 'BLOWING' && isLit) {
        extinguish();
        return;
      }

      if (appState === 'EXTINGUISHED') {
        relight();
        return;
      }
    }

    mainBtn.addEventListener('click', handleMainBtnClick);

    // --- 6. 吹熄与重燃逻辑 ---
    function extinguish() {
      if (!isLit) return;
      isLit = false;
      canBlow = false;
      blowFrames = 0;
      appState = 'EXTINGUISHED';

      mainTitle.innerText = "Wish Granted!";
      subTitle.innerText = "May all your dreams sparkle into reality!";

      actionContainer.classList.add('hidden');
      createBurst();

      if (!isMusicOn) {
        isMusicOn = true;
        updateMusicButtonUI();
        ensureAudioContext();
        resumeAudioContext();
        resumeMusicGain();
        startMusicLoop();
      }

      setTimeout(() => {
        if (!isLit) {
          mainBtn.className = "btn-relight";
          mainBtn.innerText = "Relight Again";
          statusHint.innerText = "Tap above to relight the candles";
          actionContainer.classList.remove('hidden');
        }
      }, 1700);
    }

    function relight() {
      isLit = true;
      canBlow = false;
      blowFrames = 0;
      burstParticles.length = 0;
      textParticles.length = 0;

      mainTitle.innerText = "Happy Birthday!";
      subTitle.innerText = "Make a wish and blow into the mic!";

      appState = 'BLOWING';
      mainBtn.className = "btn-blow";
      mainBtn.innerText = "Tap or Blow";
      statusHint.innerText = "Blow onto mic or tap directly to extinguish!";

      setTimeout(() => {
        if (isLit) {
          canBlow = true;
          blowFrames = 0;
        }
      }, 2000);
    }

    // --- 7. 手势 / 鼠标滑动 3D 旋转控制 ---
    let rotationY = 0;
    let rotationX = 0;
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let dragVelocityX = 0;
    let dragVelocityY = 0;

    function onPointerDown(e) {
      if (e.target.closest('#actionContainer') || e.target.closest('#musicToggle')) return;
      isDragging = true;
      lastPointerX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      lastPointerY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      dragVelocityX = 0;
      dragVelocityY = 0;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const currentY = e.clientY || (e.touches && e.touches[0].clientY) || 0;

      const deltaX = currentX - lastPointerX;
      const deltaY = currentY - lastPointerY;

      dragVelocityX = deltaX * 0.006;
      dragVelocityY = deltaY * 0.003;

      rotationY += dragVelocityX;
      rotationX += dragVelocityY;
      rotationX = Math.max(-0.25, Math.min(0.25, rotationX));

      lastPointerX = currentX;
      lastPointerY = currentY;
    }

    function onPointerUp() {
      isDragging = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    // --- 8. 3D 粒子系统与火焰 ---
    const cakeParticles = [];
    const flameParticles = [];
    const burstParticles = [];
    const textParticles = [];

    const cakeColors = [
      'rgba(255, 255, 255, ',
      'rgba(255, 253, 245, ',
      'rgba(254, 243, 199, ',
      'rgba(253, 230, 138, ',
      'rgba(250, 245, 255, '
    ];

    function addTier(radius, yBase, h, count, isTopDense) {
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const isWall = Math.random() < 0.6;
        let r, y;

        if (isWall) {
          r = radius + (Math.random() - 0.5) * 8;
          y = yBase + Math.random() * h;
        } else {
          r = Math.sqrt(Math.random()) * radius;
          y = yBase + h + (Math.random() - 0.5) * 3;
        }

        const size = Math.random() * 0.45 + 0.4;
        const color = cakeColors[Math.floor(Math.random() * cakeColors.length)];
        const alpha = isTopDense ? (Math.random() * 0.35 + 0.65) : (Math.random() * 0.3 + 0.4);

        cakeParticles.push({
          x: Math.cos(theta) * r,
          y: y,
          z: Math.sin(theta) * r,
          color: color,
          size: size,
          alpha: alpha
        });
      }
    }

    addTier(165, -95, 68, 5500, false);
    addTier(118, -25, 62, 5800, false);
    addTier(72, 38, 52, 6000, true);

    const candleXs = [-26, 0, 26];
    candleXs.forEach(cx => {
      for (let i = 0; i < 400; i++) {
        const theta = Math.random() * Math.PI * 2;
        const r = Math.random() * 3.2 + 0.8;
        const y = 90 + Math.random() * 46;
        cakeParticles.push({
          x: cx + Math.cos(theta) * r,
          y: y,
          z: Math.sin(theta) * r,
          color: 'rgba(255, 255, 255, ',
          size: Math.random() * 0.4 + 0.45,
          alpha: 0.95
        });
      }
    });

    candleXs.forEach(cx => {
      for (let i = 0; i < 160; i++) {
        const u = Math.random();
        const theta = Math.random() * Math.PI * 2;
        const r = (1 - u) * 6.5 * Math.random();
        flameParticles.push({
          cx: cx,
          theta: theta,
          r: r,
          u: u,
          speed: Math.random() * 6 + 10,
          color: u > 0.65 ? 'rgba(255, 90, 30, ' : 'rgba(255, 218, 10, '
        });
      }
    });

    // --- 9. 极高清晰度与精准垂直位置的文字点阵采样 ---
    function sampleTextTargets() {
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      // 适度画布尺寸，保证字体比例清晰饱满
      offCanvas.width = 620;
      offCanvas.height = 140;

      // 使用 900 极粗字体，确保字母笔画实心不零碎
      offCtx.fillStyle = '#ffffff';
      offCtx.font = '900 32px -apple-system, BlinkMacSystemFont, "Arial Black", Roboto, sans-serif';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';

      // 两行居中紧凑排列
      offCtx.fillText("Stay Happy Stay bright", offCanvas.width / 2, 42);
      offCtx.fillText("Stay you My girl", offCanvas.width / 2, 98);

      const imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height).data;
      const targets = [];
      // 关键优化：采样步长减小到 2.2 像素，点阵密度提升近 3 倍，轮廓非常扎实清晰
      const step = 2.2; 

      for (let y = 0; y < offCanvas.height; y += step) {
        for (let x = 0; x < offCanvas.width; x += step) {
          const px = Math.floor(x);
          const py = Math.floor(y);
          const index = (py * offCanvas.width + px) * 4;

          if (imgData[index + 3] > 140) {
            // 空间 Y 目标降到 168（蜡烛顶部在 138 左右，稍微上浮 30 单位，正好紧挨蜡烛且在标题下方）
            // 比例缩放系数控制在 0.38，确保不论在手机还是电脑宽屏中都不会溢出或过大
            const tx = (px - offCanvas.width / 2) * 0.38;
            const ty = 168 - (py - offCanvas.height / 2) * 0.38;
            const tz = (Math.random() - 0.5) * 6; // 轻微景深厚度
            targets.push({ x: tx, y: ty, z: tz });
          }
        }
      }
      return targets;
    }

    const textTargets = sampleTextTargets();

    function createBurst() {
      burstParticles.length = 0;
      textParticles.length = 0;

      const burstColors = [
        'rgba(255, 255, 255, ',
        'rgba(255, 250, 235, ',
        'rgba(254, 240, 190, ',
        'rgba(253, 224, 71, ',
        'rgba(255, 133, 173, '
      ];

      // 1. 周围发散爆炸烟花粒子
      for (let i = 0; i < 1800; i++) {
        const cx = candleXs[i % 3];
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const speed = Math.random() * 11 + 2.5;

        burstParticles.push({
          x: cx + (Math.random() - 0.5) * 8,
          y: 138 + (Math.random() - 0.5) * 8,
          z: (Math.random() - 0.5) * 8,
          vx: Math.sin(phi) * Math.cos(theta) * speed,
          vy: Math.cos(phi) * speed + 0.5,
          vz: Math.sin(phi) * Math.sin(theta) * speed * 1.3,
          size: Math.random() * 0.35 + 0.28,
          color: burstColors[Math.floor(Math.random() * burstColors.length)],
          alpha: 1.0,
          drag: 0.974,
          life: 0,
          maxLife: Math.random() * 220 + 150
        });
      }

      // 2. 刹那爆发并精准紧凑汇聚为实心文字的粒子
      const textParticleColors = [
        'rgba(255, 255, 255, ',
        'rgba(255, 245, 235, ',
        'rgba(255, 225, 238, ',
        'rgba(254, 240, 170, ',
        'rgba(255, 175, 195, '
      ];

      for (let i = 0; i < textTargets.length; i++) {
        const target = textTargets[i];
        const originCandleX = candleXs[i % 3];
        
        const angle = Math.random() * Math.PI * 2;
        const spreadSpeed = Math.random() * 6 + 1.5;

        textParticles.push({
          x: originCandleX + (Math.random() - 0.5) * 6,
          y: 138 + Math.random() * 4,
          z: (Math.random() - 0.5) * 6,
          vx: Math.cos(angle) * spreadSpeed,
          vy: Math.random() * 7 + 3,
          vz: Math.sin(angle) * spreadSpeed,
          tx: target.x,
          ty: target.y,
          tz: target.z,
          // 增微粒子实体半径，让连字更加扎实
          size: Math.random() * 0.25 + 0.52,
          color: textParticleColors[Math.floor(Math.random() * textParticleColors.length)],
          alpha: 0,
          convergeDelay: Math.random() * 12 + 8, // 快速开启聚合吸引
          age: 0,
          seed: Math.random() * 100
        });
      }
    }

    // --- 10. 渲染主循环（适配不同分辨率与端）---
    const fov = 420;

    function render() {
      requestAnimationFrame(render);

      ctx.clearRect(0, 0, width, height);

      if (!isDragging) {
        rotationY += 0.0028 + dragVelocityX;
        dragVelocityX *= 0.94;
        dragVelocityY *= 0.94;
        rotationX += dragVelocityY;
        rotationX *= 0.98;
      }

      const floatY = Math.sin(Date.now() * 0.0012) * 6;

      const cosRY = Math.cos(rotationY);
      const sinRY = Math.sin(rotationY);
      const cosRX = Math.cos(rotationX);
      const sinRX = Math.sin(rotationX);

      const renderQueue = [];
      const centerX = width / 2;
      const centerY = height * 0.52;

      function project(x, y, z) {
        const x1 = x * cosRY - z * sinRY;
        const z1 = x * sinRY + z * cosRY;
        const y2 = y * cosRX - z1 * sinRX;
        const z2 = y * sinRX + z1 * cosRX + 420;

        const scale = fov / Math.max(30, z2);
        return {
          x2d: centerX + x1 * scale,
          y2d: centerY - (y2 + floatY) * scale,
          z: z2,
          scale: scale
        };
      }

      // 蛋糕体
      for (let i = 0; i < cakeParticles.length; i++) {
        const p = cakeParticles[i];
        const proj = project(p.x, p.y, p.z);
        renderQueue.push({
          x: proj.x2d,
          y: proj.y2d,
          z: proj.z,
          size: p.size * proj.scale,
          color: p.color,
          alpha: p.alpha
        });
      }

      // 蜡烛火焰
      if (isLit) {
        const t = Date.now() * 0.0025;
        for (let i = 0; i < flameParticles.length; i++) {
          const f = flameParticles[i];
          const wave = Math.sin(t * f.speed + f.u * 8) * 2.2;
          const fx = f.cx + Math.cos(f.theta) * (f.r + wave);
          const fz = Math.sin(f.theta) * (f.r + wave);
          const fy = 132 + f.u * 26;

          const proj = project(fx, fy, fz);
          renderQueue.push({
            x: proj.x2d,
            y: proj.y2d,
            z: proj.z - 10,
            size: 1.5 * proj.scale,
            color: f.color,
            alpha: 0.95
          });
        }
      }

      // 爆炸外扩粒子
      for (let i = 0; i < burstParticles.length; i++) {
        const b = burstParticles[i];
        b.life++;
        
        b.vx *= b.drag;
        b.vy *= b.drag;
        b.vz *= b.drag;

        b.x += b.vx;
        b.y += b.vy;
        b.z += b.vz;

        b.y += Math.sin(Date.now() * 0.001 + i) * 0.03;
        b.x += Math.cos(Date.now() * 0.001 + i) * 0.03;

        b.alpha = Math.max(0, 1.0 - (b.life / b.maxLife));

        const proj = project(b.x, b.y, b.z);

        if (b.alpha > 0.005) {
          renderQueue.push({
            x: proj.x2d,
            y: proj.y2d,
            z: proj.z,
            size: b.size * proj.scale,
            color: b.color,
            alpha: b.alpha
          });
        }
      }

      // 汇聚文字粒子
      const nowTime = Date.now() * 0.003;
      for (let i = 0; i < textParticles.length; i++) {
        const tp = textParticles[i];
        tp.age++;

        if (tp.age < tp.convergeDelay) {
          tp.x += tp.vx;
          tp.y += tp.vy;
          tp.z += tp.vz;
          tp.vx *= 0.92;
          tp.vy *= 0.92;
          tp.vz *= 0.92;
          tp.alpha = Math.min(1.0, tp.age / 10);
        } else {
          // 更紧密的吸引锁定，微量阻尼防止发散
          const ease = 0.11;
          tp.x += (tp.tx - tp.x) * ease;
          tp.y += (tp.ty - tp.y) * ease;
          tp.z += (tp.tz - tp.z) * ease;

          const shimmer = Math.sin(nowTime * 2.8 + tp.seed) * 0.12;
          tp.alpha = Math.min(1.0, 0.92 + shimmer);
        }

        const proj = project(tp.x, tp.y, tp.z);
        if (proj.z > 10) {
          renderQueue.push({
            x: proj.x2d,
            y: proj.y2d,
            z: proj.z - 5,
            // 到达字形骨架后尺寸饱满加实
            size: tp.size * proj.scale * (tp.age > tp.convergeDelay ? 1.15 : 0.8),
            color: tp.color,
            alpha: tp.alpha
          });
        }
      }

      renderQueue.sort((a, b) => b.z - a.z);

      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < renderQueue.length; i++) {
        const item = renderQueue[i];
        if (item.size <= 0) continue;
        ctx.fillStyle = item.color + item.alpha + ')';
        ctx.beginPath();
        ctx.arc(item.x, item.y, Math.max(0.35, item.size), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    render();
  </script>
</body>
