<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b0a24 0%, #06020c 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      touch-action: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* UI 悬浮层 */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 20px) + 20px) 15px calc(env(safe-area-inset-bottom, 20px) + 20px);
    }

    .header {
      text-align: center;
      width: 100%;
      padding: 0 10px;
    }

    /* 优化发光：彻底去除白色发光，保留纯粹柔和淡粉光 */
    .header h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ff85ad;
      text-shadow: 
        0 0 12px rgba(255, 133, 173, 0.45),
        0 0 24px rgba(255, 106, 176, 0.25);
      margin-bottom: 8px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .header p {
      font-size: 0.95rem;
      color: #fce7f3;
      opacity: 0.88;
      letter-spacing: 0.3px;
      font-weight: 400;
      text-shadow: 0 1px 4px rgba(0,0,0,0.85);
      line-height: 1.35;
    }

    /* 左下角音乐按钮 */
    .bottom-bar {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      pointer-events: none;
    }

    .music-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .music-btn:active {
      transform: scale(0.95);
    }

    /* 初始吹气交互组件容器 */
    .initial-action {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: opacity 0.22s ease-out, transform 0.22s ease-out;
      width: max-content;
    }

    /* 吹蜡烛按钮（免麦克风弹窗） */
    .blow-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 36px;
      border-radius: 40px;
      border: none;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff7eaf 0%, #ff699a 100%);
      box-shadow: 0 8px 25px rgba(255, 105, 154, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: all 0.2s ease;
      touch-action: manipulation;
      letter-spacing: 0.5px;
      white-space: nowrap !important;
      width: max-content;
    }

    .blow-btn:active {
      transform: scale(0.96);
    }

    .sub-tip {
      font-size: 0.8rem;
      color: #fbcfe8;
      opacity: 0.85;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }

    /* 吹灭后登场的 Relight 容器 */
    .relight-action {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.26s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
      width: max-content;
    }

    /* 纯净白描边 Relight Again 按钮（强制一行、无粉色外光） */
    .relight-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 34px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.15);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 255, 255, 0.18);
      transition: all 0.2s ease;
      touch-action: manipulation;
      white-space: nowrap !important;
      width: max-content !important;
      min-width: 170px;
    }

    .relight-btn:active {
      transform: scale(0.96);
    }

    .hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translate(-50%, -48%) scale(0.94) !important;
    }

    .visible {
      opacity: 1 !important;
      pointer-events: auto !important;
      transform: translate(-50%, -50%) scale(1) !important;
    }
  </style>
</head>
<body>

  <canvas id="stage"></canvas>

  <div class="ui-layer">
    <div class="header">
      <h1 id="mainTitle">Happy Birthday!</h1>
      <p id="subTitle">Make a wish and blow out the candles!</p>
    </div>

    <!-- 1. 初始吹气交互层（零权限弹窗） -->
    <div class="initial-action" id="initialAction">
      <button class="blow-btn" id="blowBtn">Blow Candles</button>
      <span class="sub-tip" id="statusHint">Tap to blow out with sparkles</span>
    </div>

    <!-- 2. 完全独立的 Relight Again 按钮 -->
    <div class="relight-action" id="relightAction">
      <button class="relight-btn" id="relightBtn">Relight Again</button>
      <span class="sub-tip" style="color: #e2e8f0; opacity: 0.85;">Tap above to relight the candles</span>
    </div>

    <!-- 左下角音乐按钮 -->
    <div class="bottom-bar">
      <button class="music-btn" id="musicToggle">Music: ON</button>
    </div>
  </div>

  <script>
    // --- 1. 画布与视口适配 ---
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // --- 2. 状态机定义 ---
    let isLit = true;
    let audioCtx = null;
    let isMusicOn = true;
    let isMusicPlaying = false;
    let songTimeout = null;

    const mainTitle = document.getElementById('mainTitle');
    const subTitle = document.getElementById('subTitle');
    const initialAction = document.getElementById('initialAction');
    const relightAction = document.getElementById('relightAction');
    const blowBtn = document.getElementById('blowBtn');
    const relightBtn = document.getElementById('relightBtn');
    const musicToggle = document.getElementById('musicToggle');

    // --- 3. 欢快浪漫八音盒和弦循环音乐引擎 ---
    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 单个浪漫晶莹八音盒复音合成
    function playHarmonicNote(freq, startTime, duration) {
      if (!audioCtx || !isMusicOn) return;
      try {
        // 主音
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.linearRampToValueAtTime(0.24, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration);

        // 柔和泛音，增添梦幻浪漫氛围
        const oscOvertone = audioCtx.createOscillator();
        const gainOvertone = audioCtx.createGain();
        oscOvertone.type = 'sine';
        oscOvertone.frequency.setValueAtTime(freq * 2, startTime);

        gainOvertone.gain.setValueAtTime(0.0001, startTime);
        gainOvertone.gain.linearRampToValueAtTime(0.08, startTime + 0.02);
        gainOvertone.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 0.7);

        oscOvertone.connect(gainOvertone);
        gainOvertone.connect(audioCtx.destination);

        oscOvertone.start(startTime);
        oscOvertone.stop(startTime + duration * 0.7);
      } catch (e) {
        console.warn(e);
      }
    }

    // 欢快浪漫版生日旋律乐谱（带轻盈节奏感）
    const melody = [
      { f: 261.63, d: 0.32 }, { f: 261.63, d: 0.32 }, { f: 293.66, d: 0.64 }, { f: 261.63, d: 0.64 }, { f: 349.23, d: 0.64 }, { f: 329.63, d: 1.15 },
      { f: 261.63, d: 0.32 }, { f: 261.63, d: 0.32 }, { f: 293.66, d: 0.64 }, { f: 261.63, d: 0.64 }, { f: 392.00, d: 0.64 }, { f: 349.23, d: 1.15 },
      { f: 261.63, d: 0.32 }, { f: 261.63, d: 0.32 }, { f: 523.25, d: 0.64 }, { f: 440.00, d: 0.64 }, { f: 349.23, d: 0.64 }, { f: 329.63, d: 0.64 }, { f: 293.66, d: 0.95 },
      { f: 466.16, d: 0.32 }, { f: 466.16, d: 0.32 }, { f: 440.00, d: 0.64 }, { f: 349.23, d: 0.64 }, { f: 392.00, d: 0.64 }, { f: 349.23, d: 1.35 }
    ];

    // 无限循环播放器
    function startMusicLoop() {
      if (!isMusicOn) return;
      ensureAudioContext();
      if (songTimeout) clearTimeout(songTimeout);

      let curTime = audioCtx.currentTime + 0.1;
      let totalDuration = 0;

      melody.forEach(note => {
        playHarmonicNote(note.f, curTime, note.d * 1.15);
        curTime += note.d * 0.92;
        totalDuration += note.d * 0.92;
      });

      isMusicPlaying = true;
      // 循环播放衔接
      songTimeout = setTimeout(() => {
        if (isMusicOn) startMusicLoop();
      }, (totalDuration + 0.5) * 1000);
    }

    function stopMusic() {
      if (songTimeout) clearTimeout(songTimeout);
      isMusicPlaying = false;
    }

    // 屏幕任意点击/轻触即可无感自动开始循环播放
    function tryAutoPlayOnFirstTouch() {
      ensureAudioContext();
      if (!isMusicPlaying && isMusicOn) {
        startMusicLoop();
      }
    }

    window.addEventListener('touchstart', tryAutoPlayOnFirstTouch, { once: true, passive: true });
    window.addEventListener('mousedown', tryAutoPlayOnFirstTouch, { once: true });
    window.addEventListener('click', tryAutoPlayOnFirstTouch, { once: true });

    // 音乐开关
    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      ensureAudioContext();
      isMusicOn = !isMusicOn;
      musicToggle.innerText = isMusicOn ? "Music: ON" : "Music: OFF";
      musicToggle.style.opacity = isMusicOn ? "1" : "0.5";
      if (isMusicOn) {
        startMusicLoop();
      } else {
        stopMusic();
      }
    });

    // --- 4. 手势 / 鼠标滑动 3D 旋转控制 ---
    let rotationY = 0;
    let rotationX = 0;
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let dragVelocityX = 0;
    let dragVelocityY = 0;

    // --- 5. 粒子系统设置（纯白与淡香槟色，上密下疏）---
    const cakeParticles = [];
    const flameParticles = [];
    const burstParticles = [];

    const cakeColors = [
      'rgba(255, 255, 255, ',
      'rgba(255, 253, 245, ',
      'rgba(254, 243, 199, ',
      'rgba(253, 230, 138, ',
      'rgba(250, 245, 255, '
    ];

    function addTier(radius, yBase, h, count, isTopDense) {
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const isWall = Math.random() < 0.6;
        let r, y;

        if (isWall) {
          r = radius + (Math.random() - 0.5) * 8;
          y = yBase + Math.random() * h;
        } else {
          r = Math.sqrt(Math.random()) * radius;
          y = yBase + h + (Math.random() - 0.5) * 3;
        }

        const size = Math.random() * 0.45 + 0.4;
        const color = cakeColors[Math.floor(Math.random() * cakeColors.length)];
        const alpha = isTopDense ? (Math.random() * 0.35 + 0.65) : (Math.random() * 0.3 + 0.4);

        cakeParticles.push({
          x: Math.cos(theta) * r,
          y: y,
          z: Math.sin(theta) * r,
          color: color,
          size: size,
          alpha: alpha
        });
      }
    }

    addTier(165, -95, 68, 5500, false);
    addTier(118, -25, 62, 5800, false);
    addTier(72, 38, 52, 6000, true);

    const candleXs = [-26, 0, 26];
    candleXs.forEach(cx => {
      for (let i = 0; i < 400; i++) {
        const theta = Math.random() * Math.PI * 2;
        const r = Math.random() * 3.2 + 0.8;
        const y = 90 + Math.random() * 46;
        cakeParticles.push({
          x: cx + Math.cos(theta) * r,
          y: y,
          z: Math.sin(theta) * r,
          color: 'rgba(255, 255, 255, ',
          size: Math.random() * 0.4 + 0.45,
          alpha: 0.95
        });
      }
    });

    candleXs.forEach(cx => {
      for (let i = 0; i < 160; i++) {
        const u = Math.random();
        const theta = Math.random() * Math.PI * 2;
        const r = (1 - u) * 6.5 * Math.random();
        flameParticles.push({
          cx: cx,
          theta: theta,
          r: r,
          u: u,
          speed: Math.random() * 6 + 10,
          color: u > 0.65 ? 'rgba(255, 90, 30, ' : 'rgba(255, 218, 10, '
        });
      }
    });

    // --- 6. 吹灭时四周强力迸射星河 ---
    function createBurst() {
      burstParticles.length = 0;
      const burstColors = [
        'rgba(255, 255, 255, ',
        'rgba(255, 250, 235, ',
        'rgba(254, 240, 190, ',
        'rgba(253, 224, 71, ',
        'rgba(255, 133, 173, '
      ];

      for (let i = 0; i < 2600; i++) {
        const cx = candleXs[i % 3];
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const speed = Math.random() * 11.5 + 2.8;

        burstParticles.push({
          x: cx + (Math.random() - 0.5) * 8,
          y: 138 + (Math.random() - 0.5) * 8,
          z: (Math.random() - 0.5) * 8,
          vx: Math.sin(phi) * Math.cos(theta) * speed,
          vy: Math.cos(phi) * speed + 0.5,
          vz: Math.sin(phi) * Math.sin(theta) * speed * 1.3,
          size: Math.random() * 0.35 + 0.28,
          color: burstColors[Math.floor(Math.random() * burstColors.length)],
          alpha: 1.0,
          drag: 0.974,
          life: 0,
          maxLife: Math.random() * 220 + 150
        });
      }
    }

    // --- 7. 吹熄与重置点燃逻辑（零权限要求，完全无感） ---
    function extinguish() {
      if (!isLit) return;
      isLit = false;

      mainTitle.innerText = "Wish Granted!";
      subTitle.innerText = "May all your dreams sparkle into reality!";

      initialAction.classList.add('hidden');
      createBurst();

      // 如果音乐还没播放，吹灭时立刻启动欢快音乐循环
      if (!isMusicPlaying && isMusicOn) {
        startMusicLoop();
      }

      setTimeout(() => {
        if (!isLit) {
          relightAction.classList.add('visible');
        }
      }, 1600);
    }

    function relight() {
      isLit = true;
      burstParticles.length = 0;

      mainTitle.innerText = "Happy Birthday!";
      subTitle.innerText = "Make a wish and blow out the candles!";

      relightAction.classList.remove('visible');
      initialAction.classList.remove('hidden');
    }

    // 绑定吹气按钮（直接响应，无需弹窗授权）
    blowBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      tryAutoPlayOnFirstTouch();
      extinguish();
    });

    relightBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      tryAutoPlayOnFirstTouch();
      relight();
    });

    // --- 8. 触摸 / 拖拽旋转交互 ---
    function onPointerDown(e) {
      if (e.target.closest('#initialAction') || e.target.closest('#relightAction') || e.target.closest('#musicToggle')) return;
      isDragging = true;
      lastPointerX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      lastPointerY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      dragVelocityX = 0;
      dragVelocityY = 0;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const currentX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
      const currentY = e.clientY || (e.touches && e.touches[0].clientY) || 0;

      const deltaX = currentX - lastPointerX;
      const deltaY = currentY - lastPointerY;

      dragVelocityX = deltaX * 0.006;
      dragVelocityY = deltaY * 0.003;

      rotationY += dragVelocityX;
      rotationX += dragVelocityY;
      rotationX = Math.max(-0.25, Math.min(0.25, rotationX));

      lastPointerX = currentX;
      lastPointerY = currentY;
    }

    function onPointerUp() {
      isDragging = false;
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    // --- 9. 3D 渲染循环 ---
    const fov = 420;

    function render() {
      requestAnimationFrame(render);

      ctx.clearRect(0, 0, width, height);

      if (!isDragging) {
        rotationY += 0.0028 + dragVelocityX;
        dragVelocityX *= 0.94;
        dragVelocityY *= 0.94;
        rotationX += dragVelocityY;
        rotationX *= 0.98;
      }

      const floatY = Math.sin(Date.now() * 0.0012) * 6;

      const cosRY = Math.cos(rotationY);
      const sinRY = Math.sin(rotationY);
      const cosRX = Math.cos(rotationX);
      const sinRX = Math.sin(rotationX);

      const renderQueue = [];
      const centerX = width / 2;
      const centerY = height * 0.52;

      function project(x, y, z) {
        const x1 = x * cosRY - z * sinRY;
        const z1 = x * sinRY + z * cosRY;
        const y2 = y * cosRX - z1 * sinRX;
        const z2 = y * sinRX + z1 * cosRX + 420;

        const scale = fov / Math.max(30, z2);
        return {
          x2d: centerX + x1 * scale,
          y2d: centerY - (y2 + floatY) * scale,
          z: z2,
          scale: scale
        };
      }

      // 1. 蛋糕主体粒子
      for (let i = 0; i < cakeParticles.length; i++) {
        const p = cakeParticles[i];
        const proj = project(p.x, p.y, p.z);
        renderQueue.push({
          x: proj.x2d,
          y: proj.y2d,
          z: proj.z,
          size: p.size * proj.scale,
          color: p.color,
          alpha: p.alpha
        });
      }

      // 2. 蜡烛火焰粒子
      if (isLit) {
        const t = Date.now() * 0.0025;
        for (let i = 0; i < flameParticles.length; i++) {
          const f = flameParticles[i];
          const wave = Math.sin(t * f.speed + f.u * 8) * 2.2;
          const fx = f.cx + Math.cos(f.theta) * (f.r + wave);
          const fz = Math.sin(f.theta) * (f.r + wave);
          const fy = 132 + f.u * 26;

          const proj = project(fx, fy, fz);
          renderQueue.push({
            x: proj.x2d,
            y: proj.y2d,
            z: proj.z - 10,
            size: 1.5 * proj.scale,
            color: f.color,
            alpha: 0.95
          });
        }
      }

      // 3. 漫天三维星尘粒子
      for (let i = 0; i < burstParticles.length; i++) {
        const b = burstParticles[i];
        b.life++;
        
        b.vx *= b.drag;
        b.vy *= b.drag;
        b.vz *= b.drag;

        b.x += b.vx;
        b.y += b.vy;
        b.z += b.vz;

        b.y += Math.sin(Date.now() * 0.001 + i) * 0.03;
        b.x += Math.cos(Date.now() * 0.001 + i) * 0.03;

        b.alpha = Math.max(0, 1.0 - (b.life / b.maxLife));

        const proj = project(b.x, b.y, b.z);

        if (b.alpha > 0.005) {
          renderQueue.push({
            x: proj.x2d,
            y: proj.y2d,
            z: proj.z,
            size: b.size * proj.scale,
            color: b.color,
            alpha: b.alpha
          });
        }
      }

      renderQueue.sort((a, b) => b.z - a.z);

      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < renderQueue.length; i++) {
        const item = renderQueue[i];
        if (item.size <= 0) continue;
        ctx.fillStyle = item.color + item.alpha + ')';
        ctx.beginPath();
        ctx.arc(item.x, item.y, Math.max(0.35, item.size), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    render();
  </script>
</body>
</html>
